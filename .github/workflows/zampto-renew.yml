name: ZamPTO Auto Renew

on:
  schedule:
    # 每4天北京时间上午10点运行一次
    # UTC 02:00 = 北京时间 10:00
    - cron: "0 2 */4 * *"

  # 允许手动运行
  workflow_dispatch:

jobs:
  renew-zampto:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: write
      contents: read

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v6

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装系统和 Python 依赖
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            xvfb \
            x11-utils \
            xdotool \
            scrot \
            fonts-noto-cjk \
            wget \
            curl

          python -m pip install --upgrade pip
          pip install seleniumbase requests

          seleniumbase install chromedriver

      - name: 设置 sing-box 代理
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -z "$NODE_LINK" ]; then
            echo "错误：未配置 NODE_LINK Secret"
            exit 1
          fi

          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 检查本地代理
        run: |
          echo "正在检查 127.0.0.1:1081..."

          for i in $(seq 1 15); do
            if curl \
              --silent \
              --fail \
              --max-time 10 \
              --proxy http://127.0.0.1:1081 \
              https://api.ip.sb/ip; then

              echo
              echo "代理连接成功"
              exit 0
            fi

            echo "等待代理启动：$i/15"
            sleep 2
          done

          echo "代理连接失败"
          exit 1

      - name: 运行 ZamPTO 续期脚本
        env:
          ZAM_PTO_EMAIL: ${{ secrets.ZAM_PTO_EMAIL }}
          ZAM_PTO_PASSWORD: ${{ secrets.ZAM_PTO_PASSWORD }}

          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          IS_PROXY: "true"
          PROXY_SERVER: "http://127.0.0.1:1081"

        run: |
          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1920x1080x24" \
            python3 app.py

      - name: 上传错误截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zampto-error-screenshots
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 3

      - name: 清理旧工作流记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list \
            --workflow="${{ github.workflow }}" \
            --limit=100 \
            --json databaseId \
            --jq '.[].databaseId')

          count=0

          for run_id in $runs; do
            count=$((count + 1))

            if [ "$count" -gt 1 ]; then
              echo "删除运行记录：$run_id"
              gh run delete "$run_id" || true
            fi
          done
