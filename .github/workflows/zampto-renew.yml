name: Zampto Auto Renew

on:
  schedule:
    - cron: '0 2 */3 * *'
  workflow_dispatch:

jobs:
  Renew-Zampto:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
    - uses: actions/checkout@v6
    - name: ⚙ 设置 Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: 🛠️ 安装系统依赖和python依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: ⚙ 设置代理 (sing-box)
      continue-on-error: true
      env:
        NODE_LINK: ${{ secrets.NODE_LINK }}
      run: |
        bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

    - name: 🚀 运行续期脚本
      env:
        ZAMTO_EMAIL: ${{ secrets.ZAMTO_EMAIL }}
        ZAMTO_PASSWORD: ${{ secrets.ZAMTO_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        # 可选：如果 setup_proxy.sh 未设置 http_proxy，可手动指定 PROXY_SERVER
        # PROXY_SERVER: http://127.0.0.1:1080
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 zampto_renew.py

    - name: 📸 上传截图（用于调试）
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: zampto-debug-screenshots
        path: |
          *.png
          *.html
        if-no-files-found: ignore

    - name: 🧹 清理旧的工作流运行记录
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --databaseId --jq '.[].databaseId')
        count=0
        for run_id in $runs; do
          count=$((count + 1))
          if [ $count -gt 1 ]; then
            echo "删除运行记录: $run_id"
            gh run delete $run_id || true
          fi
        done
